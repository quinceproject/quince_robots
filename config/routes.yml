    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:write'

quince_robots_settings_save:
  path: quince/robots/settings/save
  methods: [POST]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::saveSettingsAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:settings'

quince_robots_purge:
  path: quince/robots/purge
  methods: [POST]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::purgeAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:purge'

quince_robots_bot_add:
  path: quince/robots/bot/add
  methods: [POST]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::addBotAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:add'

quince_robots_index_refresh:
