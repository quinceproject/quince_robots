# Trasy panelu modułu.
#
# `_legacy_controller` wskazuje zakładkę silnika, tak jak w pozostałych modułach
# linii. Moduł nie zakłada własnej zakładki: wstawienie się do sekcji „Moduły"
# PrestaShopa dokłada pozycję obok Marketplace'u i Menedżera modułów.
#
# Zakładka jest tym, do czego odnoszą się uprawnienia pracownika, więc atrybuty
# `#[AdminSecurity]` w kontrolerze sprawdzają prawa do ekranów Quince jako całości.

quince_robots:
  path: quince/robots
  methods: [GET]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_robots_file:
  path: quince/robots/file
  methods: [GET]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::fileAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_robots_traffic:
  path: quince/robots/traffic
  methods: [GET]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::trafficAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_robots_settings:
  path: quince/robots/settings
  methods: [GET]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::settingsAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

# Jeden zapis dla całego ekranu decyzji. Wcześniej każdy przełącznik był osobną
# trasą i osobnym przeładowaniem strony.
quince_robots_save:
  path: quince/robots/save
  methods: [POST]
  defaults:
    _controller: Quince\Robots\Controller\Admin\RobotsController::saveDecisionsAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_robots_write:
